name: nix-release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: nixos
    container:
      image: nixos/nix:runner
    # Secrets bind at JOB level only — step-level `env:` secret bindings are
    # silently EMPTY on our act_runner (shape-probe verified). Do not move down.
    env:
      CACHE_RO_KEY_ID: ${{ secrets.CACHE_RO_KEY_ID }}
      CACHE_RO_SECRET: ${{ secrets.CACHE_RO_SECRET }}
      GARAGE_RW_KEY_ID: ${{ secrets.GARAGE_RW_KEY_ID }}
      GARAGE_RW_SECRET: ${{ secrets.GARAGE_RW_SECRET }}
      NIX_CACHE_SECRET: ${{ secrets.NIX_CACHE_SECRET }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_RO_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_RO_SECRET }}
    steps:
      - name: Checkout
        env:
          CTOK: ${{ gitea.token }}
          SHA: ${{ gitea.sha }}
          REPO: ${{ gitea.repository }}
        run: |
          set -eu
          git init -q repo && cd repo
          git remote add origin "http://x-access-token:$CTOK@127.0.0.1:3000/$REPO.git"
          git fetch -q --tags origin "$SHA"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Enable flakes
        env:
          CACHE_ENDPOINT: '${{ vars.CACHE_ENDPOINT }}'
          CACHE_BUCKET: '${{ vars.CACHE_BUCKET }}'
          CACHE_REGION: '${{ vars.CACHE_REGION }}'
          CACHE_PUBKEY: '${{ vars.CACHE_PUBLIC_KEY }}'
        run: |
          set -eu
          echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
          echo "filter-syscalls = false" >> /etc/nix/nix.conf
          # Garage S3 speaks SigV4 only; nix's https://AK:SK@ basic-auth substituter is
          # rejected ("Unsupported authorization method"). Use the s3:// substituter form.
          # NOTE: /root/.aws/credentials is a READ-ONLY host bind in this runner image,
          # so credentials go through NIX_CONFIG env (AWS SDK honors AWS_ACCESS_KEY_ID/SECRET).
          # Fleet cache first, then public sources (official cache + USTC mirror fallback).
          # nix.conf lines APPEND here — the runner image's default substituters must be
          # overridden explicitly or --fallback can pull from an unconfigured source list.
          # READ side lists the arch bucket first, then the legacy bucket (transitional —
          # legacy still serves pre-migration objects), then public mirrors.
          # profile=cache-ro is REQUIRED: the runner's mounted /root/.aws/credentials has
          # only NAMED profiles ([fleet-cache], [cache-ro]) and no [default]; without an
          # explicit profile nix falls back to anonymous GETs and Garage answers 403,
          # silently disabling the cache ("disabling binary cache ... for 60 seconds").
          printf 'substituters = s3://%s?endpoint=https://%s&region=%s&profile=cache-ro s3://astra-lab-cachix?endpoint=https://%s&region=%s&profile=cache-ro https://cache.nixos.org https://mirrors.ustc.edu.cn/nix-channels/store\n' "$CACHE_BUCKET" "$CACHE_ENDPOINT" "$CACHE_REGION" "$CACHE_ENDPOINT" "$CACHE_REGION" >> /etc/nix/nix.conf
          printf 'trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= %s\n' "$CACHE_PUBKEY" >> /etc/nix/nix.conf
          printf '%s\n' "$NIX_CACHE_SECRET" > /root/.nix-cache.sec
          chmod 600 /root/.nix-cache.sec
          echo "CACHE_CONFIGURED"

      - name: Verify fleet cache is reachable (fail fast)
        run: |
          set -eu
          echo "=== [1] job-wide AWS env (nix reads these FIRST):"
          echo "  AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-<unset>} (len ${#AWS_ACCESS_KEY_ID})"
          echo "  AWS_PROFILE=${AWS_PROFILE:-<unset>}"
          echo "  AWS_DEFAULT_PROFILE=${AWS_DEFAULT_PROFILE:-<unset>}"
          echo "  AWS_SHARED_CREDENTIALS_FILE=${AWS_SHARED_CREDENTIALS_FILE:-<unset>}"
          echo "  AWS_EC2_METADATA_DISABLED=${AWS_EC2_METADATA_DISABLED:-<unset>}"
          echo "  AWS_REGION=${AWS_REGION:-<unset>} AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-<unset>}"
          echo "  HOME=$HOME  pwd=$(pwd)"
          echo "=== [2] credentials file in this job container:"
          ls -la /root/.aws/credentials 2>&1 || echo "NO FILE"
          echo "=== [3] nix, resolved from PATH:"
          command -v nix; nix --version
          echo "=== [4] nix store info, env UNCHANGED (this is the failing call):"
          nix store info --store "s3://${{ vars.CACHE_BUCKET }}?endpoint=https://${{ vars.CACHE_ENDPOINT }}&region=${{ vars.CACHE_REGION }}&profile=cache-ro" 2>&1 || echo "  -> exit=$?"
          echo "=== [5] same, but with AWS_* env scrubbed (tests whether env poisoning is the cause):"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_PROFILE AWS_SESSION_TOKEN || true
          nix store info --store "s3://${{ vars.CACHE_BUCKET }}?endpoint=https://${{ vars.CACHE_ENDPOINT }}&region=${{ vars.CACHE_REGION }}&profile=cache-ro" 2>&1 || echo "  -> exit=$?"
          echo "=== [6] same, but with explicit AWS_SHARED_CREDENTIALS_FILE:"
          export AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
          nix store info --store "s3://${{ vars.CACHE_BUCKET }}?endpoint=https://${{ vars.CACHE_ENDPOINT }}&region=${{ vars.CACHE_REGION }}&profile=cache-ro" 2>&1 || echo "  -> exit=$?"
          echo "DIAG_DONE"
          exit 1

      - name: Build all four artifacts (musl static)
        run: |
          cd repo/ci
          CORE=$(nix build --no-link --print-out-paths .#easytier-core --fallback)
          CLI=$(nix build --no-link --print-out-paths .#easytier-cli --fallback)
          WEB=$(nix build --no-link --print-out-paths .#easytier-web --fallback)
          EMB=$(nix build --no-link --print-out-paths .#easytier-web-embed --fallback)
          mkdir -p /tmp/dist
          cp -L $CORE/bin/easytier-core /tmp/dist/easytier-core
          cp -L $CLI/bin/easytier-cli /tmp/dist/easytier-cli
          cp -L $WEB/bin/easytier-web /tmp/dist/easytier-web
          cp -L $EMB/bin/easytier-web /tmp/dist/easytier-web-embed
          $CORE/bin/easytier-core --version
          $CLI/bin/easytier-cli --version
          ls -la /tmp/dist

      - name: Push closure to fleet cache
        env:
          # nix's s3:// writer needs explicit credentials; the job-wide AWS_* are
          # the read-only pair (substituter use) and cannot write -> 403.
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_RW_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_RW_SECRET }}
        run: |
          set -eu
          cd repo/ci
          STORE="s3://${{ vars.CACHE_BUCKET }}?endpoint=https://${{ vars.CACHE_ENDPOINT }}&region=${{ vars.CACHE_REGION }}"
          nix copy --to "$STORE" \
            .#easytier-core .#easytier-cli .#easytier-web .#easytier-web-embed
          # Sign what we just pushed (daemon drops secret-key-files; store sign is the reliable route).
          for t in easytier-core easytier-cli easytier-web easytier-web-embed; do
            P=$(nix build --no-link --print-out-paths ".#$t")
            nix store sign --key-file /root/.nix-cache.sec --store "$STORE" "$P"
          done
          echo "PUSHED"

      - name: Publish Gitea Release
        env:
          RUNNER_API_ORIGIN: '${{ vars.RUNNER_API_ORIGIN }}'
        run: |
          cd repo
          REF=$(git for-each-ref --points-at HEAD --format="%(refname:lstrip=2)" refs/tags/v* | head -1)
          [ -n "$REF" ] || { echo "no tag at HEAD"; exit 1; }
          TAG="$REF"
          export REL_TAG="$TAG"
          git for-each-ref --format="%(contents)" "refs/tags/$TAG" > /tmp/anno.txt
          echo  | base64 -d > /tmp/mkpayload.py
          PAYLOAD=$(nix develop --quiet --no-warn-dirty ./ci -c python3 /tmp/mkpayload.py)
          # Self-hosted runners cannot reach the WAN front; the forge origin comes
          # from repo config (RUNNER_API_ORIGIN) so no deployment detail lives here.
          [ -n "$RUNNER_API_ORIGIN" ] || { echo "RUNNER_API_ORIGIN not configured"; exit 1; }
          API="${RUNNER_API_ORIGIN}/api/v1/repos/${GITHUB_REPOSITORY}"
          RESP=$(curl -s -X POST -H "Authorization: token $RELEASE_TOKEN" -H "Content-Type: application/json" -d "$PAYLOAD" "$API/releases")
          RID=$(printf "%s" "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RID" ]; then
            RID=$(curl -s -H "Authorization: token $RELEASE_TOKEN" "$API/releases/tags/$TAG" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi
          if [ -z "$RID" ]; then
            echo "RELEASE_CREATE_FAILED resp=$RESP"
            exit 1
          fi
          echo "release_id=$RID"
          for f in /tmp/dist/*; do
            FN=$(basename "$f")
            curl -s -X POST -H "Authorization: token $RELEASE_TOKEN" -F "attachment=@$f" "$API/releases/$RID/assets?name=$FN" >/dev/null
            echo "uploaded $FN"
          done
          echo "RELEASE_DONE"
