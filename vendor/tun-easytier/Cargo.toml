[package]
edition = "2021"
rust-version = "1.75"
name = "tun-easytier"
version = "1.1.1"
authors = [
    "meh. <meh@schizofreni.co>",
    "@ssrlive",
    "sijie.sun <sunsijie@buaa.edu.cn>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TUN device creation and handling."
readme = "README.md"
keywords = [
    "tun",
    "network",
    "tunnel",
    "bindings",
]
license = "WTFPL"
repository = "https://github.com/EasyTier/rust-tun"

[package.metadata.docs.rs]
features = ["async"]

[features]
async = [
    "tokio",
    "futures-core",
    "tokio-util",
]
default = ["wintun-dns"]
wintun-dns = []

[lib]
name = "tun_easytier"
crate-type = [
    "staticlib",
    "cdylib",
    "lib",
]
path = "src/lib.rs"

[[example]]
name = "dev-config"
path = "examples/dev-config.rs"

[[example]]
name = "ping-tun"
path = "examples/ping-tun.rs"
required-features = ["async"]

[[example]]
name = "read"
path = "examples/read.rs"

[[example]]
name = "read-async"
path = "examples/read-async.rs"
required-features = ["async"]

[[example]]
name = "read-async-codec"
path = "examples/read-async-codec.rs"
required-features = ["async"]

[[example]]
name = "split"
path = "examples/split.rs"

[[example]]
name = "write"
path = "examples/write.rs"

[dependencies]
cfg-if = "1"
log = "0.4"
thiserror = "1"

[dependencies.bytes]
version = "1"

[dependencies.futures-core]
version = "0.3"
optional = true

[dependencies.libc]
version = "0.2"
features = ["extra_traits"]

[dependencies.tokio]
version = "1"
features = [
    "net",
    "macros",
    "io-util",
]
optional = true

[dependencies.tokio-util]
version = "0.7"
features = ["codec"]
optional = true

[dev-dependencies]
env_logger = "0.11"
futures = "0.3"
packet = "0.1"
serde_json = "1"

[dev-dependencies.ctrlc2]
version = "3"
features = [
    "tokio",
    "termination",
]

[dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android", target_os="freebsd"))'.dependencies.nix]
version = "0.29"
features = ["ioctl"]

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
ipnet = "2"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
]

[target.'cfg(target_os = "windows")'.dependencies.wintun]
version = "0.5"
features = ["panic_on_unsent_packets"]
